name: LeapClue — Build & Publish Docker Image

# Builds the openclaw-instance image for LeapClue managed customer VMs.
# Pushes to DigitalOcean Container Registry on every push to main.
# Only builds linux/amd64 — DigitalOcean Droplets are x86_64.
#
# Required GitHub secret:
#   DO_REGISTRY_TOKEN — a DigitalOcean API token with registry write access.
#   Add at: Settings → Secrets and variables → Actions → New repository secret
#
# Required DO setup (one-time):
#   1. Create a DO Container Registry named "leapclue" in your DO account.
#   2. Image will be at: registry.digitalocean.com/leapclue/openclaw-instance:latest

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".agents/**"
      - "skills/**"
  workflow_dispatch:

concurrency:
  group: leapclue-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_REGISTRY: registry.digitalocean.com
  DO_REGISTRY_NAME: leapclue-container-registry
  IMAGE_NAME: openclaw-instance

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DO Registry auth: both username and password are the DO API token.
      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DO_REGISTRY }}
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build and push :latest (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DO_REGISTRY }}/${{ env.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DO_REGISTRY }}/${{ env.DO_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
